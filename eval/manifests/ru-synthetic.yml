# niobures/synthetic-speech-diarization-ru (Hugging Face, MIT). Synthetic TTS
# Russian conversations with speakers[] segment annotations in parquet.
# TTS voices -> optimistic absolute DER; use as a relative regression gate.
#
# KNOWN DATASET ARTIFACT (measured 2026-09-02): the speakers[] annotation
# timeline is broken — segments tile the file contiguously while the mixed
# audio contains inter-clip silence, so 73.6% of reference-"speech" frames
# measure < -35 dBFS (Silero v6 and segmentation-3.0 agree within 2pp on
# coverage). The resulting ~43pp Miss is a dataset artifact, not a model
# failure: read ru-synthetic as a Conf-only relative gate; absolute numbers
# come from real-data sets (voxconverse, msdwild, ru-youtube).
name: ru-synthetic
license: MIT
parser: ru_synthetic_parquet
channel_policy: mono
baseline_der: null
tuning: true
subset: true
subset_files:
  - train-00006-of-00030_0052
  - train-00008-of-00030_0030
  - train-00008-of-00030_0031
  - train-00008-of-00030_0035
  - train-00012-of-00030_0024
# Subset regression gate (Conf-only — DER is inflated by the annotation-timeline
# artifact above). Re-baselined 2026-09-07 on the pipeline-v2 core (AHC default
# kind, threshold=0.60 / ceiling=128 / gap-merge=0.3): measured subset Conf
# 12.66. The jump vs 4.00 (2026-09-05) is short-TTS-blip fragmentation: dense
# window-mean aggregates of 0.4–2 s blips land just under the 0.60 merge
# threshold and split from the same voice's longer segments (full-set Conf
# moved only 8.59 → 9.82, within noise on this artifact set).
subset_gate:
  conf: 16.0
# Online (live Fast path) gate ranges, REGRESSION bounds: re-measured 2026-09-30
# on the same 5 subset files with production-faithful chunking, after the
# stop-time refinement (05b) shipped at its calibrated merge threshold, 0.75.
# Measured: DER 54.76 (FA 0.00 / Miss 31.08 / Conf 23.68), so conf_delta +11.02
# against the offline Conf 12.66; lag median 1.388 s / p90 1.614 s (unchanged by
# the refinement); flip rate 0.030; 2.90 label runs per reference speaker live
# and 1.00 final; 6.63 cluster switches per speaker-minute; live_final_flip
# 20.4 %. `der_delta` is deliberately not gated here: this set's offline DER is
# artifact-inflated (see eval/README Notes), and the refinement's tighter
# coverage now reads as extra Miss (33.68 against 18.27 before it on the full
# set), so the difference says more about the artifacts than the pipeline. Conf
# is what this set can be gated on, hence `conf_delta` (design D7). Real-time
# factor (0.035) and the stop-time cost (4.2 s per audio hour) are recorded and
# never gated.
#
# Full set (2000 files, 26.16 h), offline Conf 9.82: online Conf 21.73 before the
# refinement (+11.92), 14.13 with it at the offline merge threshold 0.60 (+4.31),
# 20.65 at the shipped 0.75 (+10.83); live_final_flip 36.39 % against the 5.0 %
# target. The two held-out sets disagree on the threshold: voxconverse (real
# multi-speaker conversation) gains most at 0.75, these synthetic two-speaker
# clips prefer 0.60, and 0.75 was the value chosen on the voxconverse-dev tuning
# set. +3.0 and 5.0 % stay the stated targets; the bounds below only stop the
# numbers getting worse.
online_gate:
  der: 60.0
  conf_delta: 16.0
  lag_p90: 3.0
  flip_rate: 0.10
  final_runs_per_speaker: 4.0
  switch_rate_per_speaker_minute: 12.0
  live_final_flip: 26.0
sources:
  - kind: hf
    url: https://huggingface.co/datasets/niobures/synthetic-speech-diarization-ru
    dataset_id: niobures/synthetic-speech-diarization-ru
    patterns:
      - train-*.parquet
