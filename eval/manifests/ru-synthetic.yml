# niobures/synthetic-speech-diarization-ru (Hugging Face, MIT). Synthetic TTS
# Russian conversations with speakers[] segment annotations in parquet.
# TTS voices -> optimistic absolute DER; use as a relative regression gate.
#
# KNOWN DATASET ARTIFACT (measured 2026-09-02): the speakers[] annotation
# timeline is broken — segments tile the file contiguously while the mixed
# audio contains inter-clip silence, so 73.6% of reference-"speech" frames
# measure < -35 dBFS (Silero v6 and segmentation-3.0 agree within 2pp on
# coverage). The resulting ~43pp Miss is a dataset artifact, not a model
# failure: read ru-synthetic as a Conf-only relative gate; absolute numbers
# come from real-data sets (voxconverse, msdwild, ru-youtube).
name: ru-synthetic
license: MIT
parser: ru_synthetic_parquet
channel_policy: mono
baseline_der: null
tuning: true
subset: true
subset_files:
  - train-00006-of-00030_0052
  - train-00008-of-00030_0030
  - train-00008-of-00030_0031
  - train-00008-of-00030_0035
  - train-00012-of-00030_0024
# Subset regression gate (Conf-only — DER is inflated by the annotation-timeline
# artifact above). Re-baselined 2026-09-05 on tuned clustering defaults
# threshold=0.60 / ceiling=128 / gap-merge=0.3: measured subset Conf 4.00.
subset_gate:
  conf: 6.0
sources:
  - kind: hf
    url: https://huggingface.co/datasets/niobures/synthetic-speech-diarization-ru
    dataset_id: niobures/synthetic-speech-diarization-ru
    patterns:
      - train-*.parquet
