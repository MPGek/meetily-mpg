# VoxConverse dev split (Oxford VGG) — TUNING data only (diarization-param-tuning
# D5). Audio zip from the official mirror; reference RTTMs come from the same
# joonson/voxconverse repo zip already cached for the test set
# (voxconverse-master/dev/*.rttm, 216 files). License: research use only.
# NEVER use this set to select published results — held-out scoring stays on
# voxconverse (test) + msdwild.
name: voxconverse-dev
license: "Research use only (VoxConverse, Oxford VGG)"
parser: rttm_passthrough
channel_policy: mono
tuning: true
normalize:
  audio_archive: voxconverse_dev_wav.zip
  audio_glob: audio/*.wav
  rttm_archive: voxconverse-repo.zip
  rttm_glob: voxconverse-master/dev/*.rttm
sources:
  - kind: http
    url: https://www.robots.ox.ac.uk/~vgg/data/voxconverse/data/voxconverse_dev_wav.zip
    filename: voxconverse_dev_wav.zip
  - kind: http
    url: https://github.com/joonson/voxconverse/archive/refs/heads/master.zip
    filename: voxconverse-repo.zip
