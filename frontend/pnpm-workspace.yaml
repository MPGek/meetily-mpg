allowBuilds:
  unrs-resolver: true

# Pin one ProseMirror copy for BlockNote (pnpm 10+ reads overrides here,
# not from package.json's "pnpm" field).
overrides:
  prosemirror-model: 1.25.3
  prosemirror-state: 1.4.3
  prosemirror-view: 1.41.3
  prosemirror-transform: 1.10.4
  prosemirror-tables: 1.8.1
